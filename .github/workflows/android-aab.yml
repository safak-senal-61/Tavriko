name: Android AAB (local EAS build)

on:
  workflow_dispatch:
  push:
    branches: [fix/android-version-code]
    paths: [".github/workflows/android-aab.yml", "client/app.json"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build AAB
        working-directory: client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: npx -y eas-cli@latest build --local -p android --profile production --non-interactive --output ${{ github.workspace }}/tavriko.aab
      - uses: actions/upload-artifact@v4
        with:
          name: tavriko-aab
          path: tavriko.aab
