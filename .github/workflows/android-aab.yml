name: Android APK + AAB (local EAS builds)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            profile: preview
            output: tavriko.apk
          - target: aab
            profile: production
            output: tavriko.aab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile shared package
        run: npm run build:shared
      - name: Build ${{ matrix.target }}
        working-directory: client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: npx -y eas-cli@latest build --local -p android --profile ${{ matrix.profile }} --non-interactive --output ${{ github.workspace }}/${{ matrix.output }}
      - name: Verify AAB
        if: matrix.target == 'aab'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$jar"
          java -jar "$jar" validate --bundle=tavriko.aab
          java -jar "$jar" dump manifest --bundle=tavriko.aab > "$RUNNER_TEMP/tavriko-manifest.xml"
          java -jar "$jar" dump config --bundle=tavriko.aab > "$RUNNER_TEMP/tavriko-bundle-config.txt"
          grep 'PAGE_ALIGNMENT_16K' "$RUNNER_TEMP/tavriko-bundle-config.txt"
          {
            echo "Commit: $GITHUB_SHA"
            python3 scripts/verify-play-aab.py tavriko.aab "$RUNNER_TEMP/tavriko-manifest.xml"
            sha256sum tavriko.aab
          } | tee tavriko-aab-verification.txt
      - name: Verify APK
        if: matrix.target == 'apk'
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          "$apksigner" verify --print-certs tavriko.apk
          "$aapt" dump badging tavriko.apk | head -5
          {
            echo "Commit: $GITHUB_SHA"
            "$aapt" dump badging tavriko.apk | grep -E "^package:" || true
            sha256sum tavriko.apk
          } | tee tavriko-apk-verification.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tavriko-${{ matrix.target }}
          path: |
            ${{ matrix.output }}
            tavriko-${{ matrix.target }}-verification.txt
          if-no-files-found: error
