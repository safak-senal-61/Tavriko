name: Android AAB (local EAS build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile shared package
        run: npm run build:shared
      - name: Build AAB
        working-directory: client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: npx -y eas-cli@latest build --local -p android --profile production --non-interactive --output ${{ github.workspace }}/tavriko.aab
      - name: Verify release bundle
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool.jar"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$jar"
          java -jar "$jar" validate --bundle=tavriko.aab
          java -jar "$jar" dump manifest --bundle=tavriko.aab > "$RUNNER_TEMP/tavriko-manifest.xml"
          java -jar "$jar" dump config --bundle=tavriko.aab > "$RUNNER_TEMP/tavriko-bundle-config.txt"
          grep 'PAGE_ALIGNMENT_16K' "$RUNNER_TEMP/tavriko-bundle-config.txt"
          {
            echo "Commit: $GITHUB_SHA"
            python3 scripts/verify-play-aab.py tavriko.aab "$RUNNER_TEMP/tavriko-manifest.xml"
            sha256sum tavriko.aab
          } | tee tavriko-aab-verification.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tavriko-aab
          path: |
            tavriko.aab
            tavriko-aab-verification.txt
          if-no-files-found: error
