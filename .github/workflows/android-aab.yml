name: Android APK (one-off local EAS build)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit used for the matching AAB
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile shared package
        run: npm run build:shared
      - name: Build signed APK
        working-directory: client
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          set -euo pipefail
          node -e 'const fs = require("node:fs"); const config = require("./eas.json"); config.build["production-apk"] = { extends: "production", autoIncrement: false, android: { buildType: "apk" } }; fs.writeFileSync("eas.json", JSON.stringify(config, null, 2) + "\n");'
          npx -y eas-cli@latest build --local -p android --profile production-apk --non-interactive --output "$GITHUB_WORKSPACE/tavriko.apk"
      - name: Verify release APK
        run: |
          set -euo pipefail
          signer="$(find "${ANDROID_HOME:?}/build-tools" -name apksigner | sort -V | tail -n 1)"
          tools="$(dirname "$signer")"
          "$tools/aapt2" dump badging tavriko.apk > "$RUNNER_TEMP/tavriko-badging.txt"
          version="$(node -p 'require("./client/app.json").expo.version')"
          grep -F "package: name='com.tavriko.app'" "$RUNNER_TEMP/tavriko-badging.txt" | grep -F "versionName='$version'"
          target="$(sed -n "s/^targetSdkVersion:'\([0-9]*\)'$/\1/p" "$RUNNER_TEMP/tavriko-badging.txt")"
          test "$target" -ge 36
          grep -F "'arm64-v8a'" "$RUNNER_TEMP/tavriko-badging.txt"
          "$tools/zipalign" -c -P 16 4 tavriko.apk
          {
            echo "Commit: $(git rev-parse HEAD)"
            grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' "$RUNNER_TEMP/tavriko-badging.txt"
            "$signer" verify --verbose --print-certs tavriko.apk
            sha256sum tavriko.apk
          } | tee tavriko-apk-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tavriko-apk
          path: |
            tavriko.apk
            tavriko-apk-verification.txt
          if-no-files-found: error
