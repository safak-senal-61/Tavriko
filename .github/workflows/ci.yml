name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vitest – ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [shared, server, client, cloudflare]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies from the root lockfile
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.workspace }}
        run: npm test
