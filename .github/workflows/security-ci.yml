name: Security and quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/harden-critical-endpoints]

permissions:
  contents: read

concurrency:
  group: tavriko-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Temporary lockfile repair step: the committed workspace lock was missing
      # server dependencies. The generated lockfile is uploaded for review/commit.
      - name: Regenerate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Capture dependency diagnostics
        if: always()
        run: |
          node --version
          npm --version
          npm ls --all --depth=0 > npm-dependency-tree.txt 2>&1 || true
      - name: Dependency vulnerability audit
        id: audit
        run: |
          audit_status=0
          npm audit --audit-level=high --json > npm-audit.json || audit_status=$?
          echo "npm audit exit code: $audit_status"
          exit "$audit_status"
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-diagnostics
          retention-days: 14
          path: |
            package-lock.json
            npm-audit.json
            npm-dependency-tree.txt
          if-no-files-found: warn

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tavriko
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tavriko
      JWT_SECRET: ci-only-test-secret-do-not-use-in-production-0123456789
      SUPABASE_JWT_SECRET: ci-only-test-secret-do-not-use-in-production-0123456789
      INTERNAL_API_SECRET: ci-only-internal-test-secret-0123456789
      PORTAL_ADMIN_EMAIL: ci-admin@example.invalid
      PORTAL_ADMIN_PASSWORD: ci-only-password-not-for-production
      GOOGLE_CLIENT_ID: ci-google-client-id
      CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Build all workspaces
        if: always()
        run: npm run build
      - name: Test shared workspace
        if: always()
        run: npm run test:shared
      - name: Test server workspace
        if: always()
        run: npm run test:server
      - name: Test client workspace
        if: always()
        run: npm run test:client
      - name: Test Cloudflare workspace
        if: always()
        run: npm run test:cloudflare
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-diagnostics
          retention-days: 14
          path: package-lock.json
          if-no-files-found: warn
