name: Security and quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/harden-critical-endpoints]

permissions:
  contents: read

concurrency:
  group: tavriko-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        id: install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee dependency-install.log
      - name: Capture dependency diagnostics
        if: always()
        run: |
          node --version > runtime-diagnostics.txt 2>&1
          npm --version >> runtime-diagnostics.txt 2>&1
          npm ls --all --depth=0 >> runtime-diagnostics.txt 2>&1 || true
      - name: Dependency vulnerability audit
        if: steps.install.outcome == 'success'
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit.json
          audit_status=$?
          echo "npm audit exit code: $audit_status" | tee npm-audit-status.txt
          exit "$audit_status"
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            dependency-install.log
            runtime-diagnostics.txt
            npm-audit.json
            npm-audit-status.txt

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tavriko
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tavriko
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/tavriko
      JWT_SECRET: ci-only-test-secret-do-not-use-in-production-0123456789
      SUPABASE_JWT_SECRET: ci-only-test-secret-do-not-use-in-production-0123456789
      INTERNAL_API_SECRET: ci-only-internal-test-secret-0123456789
      PORTAL_ADMIN_EMAIL: ci-admin@example.invalid
      PORTAL_ADMIN_PASSWORD: ci-only-password-not-for-production
      GOOGLE_CLIENT_ID: ci-google-client-id
      CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        id: install
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee dependency-install.log
      - name: Prepare PostgreSQL test schema
        if: steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npx prisma generate --schema=server/prisma/schema.prisma 2>&1 | tee prisma-generate.log
          npx prisma db push --schema=server/prisma/schema.prisma 2>&1 | tee prisma-db-push.log
      - name: Build all workspaces
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Test shared workspace
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run test:shared 2>&1 | tee test-shared.log
      - name: Test server workspace
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run test:server 2>&1 | tee test-server.log
      - name: Test client workspace
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run test:client 2>&1 | tee test-client.log
      - name: Test Cloudflare workspace
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run test:cloudflare 2>&1 | tee test-cloudflare.log
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            dependency-install.log
            prisma-generate.log
            prisma-db-push.log
            build.log
            test-shared.log
            test-server.log
            test-client.log
            test-cloudflare.log
