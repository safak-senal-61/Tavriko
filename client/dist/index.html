      (() => {
        const counts = Object.create(null);
        const endpoint = '/api/observability/browser';
        const cdnHost = 'tavriko-cdn.uncertainidentity8.workers.dev';
        function report(kind) {
          if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
          counts[kind] = (counts[kind] || 0) + 1;
          if (counts[kind] > 2) return;
          const body = JSON.stringify({ kind });
          try {
            fetch(endpoint, { method: 'POST', credentials: 'omit', keepalive: true, headers: { 'Content-Type': 'application/json' }, body }).catch(() => {});
          } catch {}
        }
        addEventListener('error', (event) => {
          if (event.target === window) { report('js'); return; }
          const target = event.target;
          if (!target || !['IMG','LINK','SCRIPT','AUDIO','VIDEO','SOURCE'].includes(target.tagName)) return;
          try {
            const resource = new URL(target.currentSrc || target.src || target.href);
            if (resource.hostname === cdnHost) report('cdn_asset');
            else if (resource.origin === location.origin) report('app_asset');
          } catch {}
        }, true);
        addEventListener('unhandledrejection', () => report('promise'));
      })();
